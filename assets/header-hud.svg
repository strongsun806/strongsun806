<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050811"/>
      <stop offset="50%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>

    <linearGradient id="goldAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>

    <linearGradient id="gridFade" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.0"/>
      <stop offset="40%" stop-color="#22d3ee" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.28"/>
    </linearGradient>

    <radialGradient id="orbCyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="orbIndigo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0"/>
    </radialGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <pattern id="hudGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.8"/>
    </pattern>
  </defs>

  <style>
    .title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 900;
      font-size: 46px;
      fill: #f8fafc;
      letter-spacing: 2px;
    }
    .subtitle {
      font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
      font-weight: 600;
      font-size: 15px;
      fill: #38bdf8;
      letter-spacing: 3px;
    }
    .hud-text {
      font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
      font-size: 11px;
      fill: #64748b;
      letter-spacing: 1.5px;
    }
    .hud-val {
      font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
      font-size: 11px;
      fill: #22d3ee;
      font-weight: 700;
      letter-spacing: 1.5px;
    }
    .badge-text {
      font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
      font-size: 11.5px;
      fill: #e2e8f0;
      font-weight: 600;
      letter-spacing: 1px;
    }
    .pulse-node {
      animation: pulse 3s ease-in-out infinite;
    }
    .pulse-node-delay {
      animation: pulse 3s ease-in-out 1.5s infinite;
    }
    .scanline {
      animation: scan 6s linear infinite;
    }
    .float-slow {
      animation: floatY 5s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.35; }
      50% { opacity: 1; }
    }
    @keyframes scan {
      0% { transform: translateY(-300px); opacity: 0; }
      20% { opacity: 0.5; }
      80% { opacity: 0.5; }
      100% { transform: translateY(300px); opacity: 0; }
    }
    @keyframes floatY {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-6px); }
    }
  </style>

  <!-- Main Background -->
  <rect width="1000" height="300" rx="16" fill="url(#bgGrad)"/>
  <rect width="1000" height="300" rx="16" fill="url(#hudGrid)" opacity="0.65"/>

  <!-- Ambient Glow Orbs -->
  <circle cx="180" cy="80" r="220" fill="url(#orbCyan)" class="pulse-node"/>
  <circle cx="820" cy="220" r="240" fill="url(#orbIndigo)" class="pulse-node-delay"/>

  <!-- Perspective 3D Floor Horizon Grid -->
  <g opacity="0.45">
    <path d="M 0 220 L 1000 220" stroke="#1e293b" stroke-width="1"/>
    <path d="M 0 245 L 1000 245" stroke="#22d3ee" stroke-width="0.6" stroke-opacity="0.4"/>
    <path d="M 0 272 L 1000 272" stroke="#22d3ee" stroke-width="0.8" stroke-opacity="0.6"/>
    <path d="M 500 160 L 100 300" stroke="url(#gridFade)" stroke-width="1.2"/>
    <path d="M 500 160 L 260 300" stroke="url(#gridFade)" stroke-width="1.2"/>
    <path d="M 500 160 L 420 300" stroke="url(#gridFade)" stroke-width="1.2"/>
    <path d="M 500 160 L 580 300" stroke="url(#gridFade)" stroke-width="1.2"/>
    <path d="M 500 160 L 740 300" stroke="url(#gridFade)" stroke-width="1.2"/>
    <path d="M 500 160 L 900 300" stroke="url(#gridFade)" stroke-width="1.2"/>
  </g>

  <!-- Subtle Horizontal Scanline -->
  <rect x="0" y="0" width="1000" height="2" fill="url(#cyanGlow)" class="scanline" opacity="0.35"/>

  <!-- Constellation / Spatial Nodes Left -->
  <g stroke="#22d3ee" stroke-width="1" opacity="0.5" class="float-slow">
    <line x1="65" y1="95" x2="125" y2="65" stroke-opacity="0.4"/>
    <line x1="125" y1="65" x2="155" y2="125" stroke-opacity="0.4"/>
    <line x1="65" y1="95" x2="155" y2="125" stroke-opacity="0.4"/>
    <line x1="155" y1="125" x2="110" y2="175" stroke-opacity="0.3"/>
    <circle cx="65" cy="95" r="3.5" fill="#22d3ee" class="pulse-node"/>
    <circle cx="125" cy="65" r="4.5" fill="#38bdf8"/>
    <circle cx="155" cy="125" r="3" fill="#818cf8" class="pulse-node-delay"/>
    <circle cx="110" cy="175" r="2.5" fill="#22d3ee"/>
  </g>

  <!-- Constellation / Spatial Nodes Right -->
  <g stroke="#818cf8" stroke-width="1" opacity="0.55" class="float-slow">
    <line x1="845" y1="85" x2="915" y2="60" stroke-opacity="0.4"/>
    <line x1="915" y1="60" x2="935" y2="130" stroke-opacity="0.4"/>
    <line x1="845" y1="85" x2="935" y2="130" stroke-opacity="0.4"/>
    <line x1="845" y1="85" x2="880" y2="165" stroke-opacity="0.3"/>
    <circle cx="845" cy="85" r="4" fill="#818cf8" class="pulse-node-delay"/>
    <circle cx="915" cy="60" r="3" fill="#22d3ee"/>
    <circle cx="935" cy="130" r="4.5" fill="#fbbf24" class="pulse-node"/>
    <circle cx="880" cy="165" r="2.5" fill="#38bdf8"/>
  </g>

  <!-- HUD Corner Brackets -->
  <g stroke="#22d3ee" stroke-width="2" fill="none" opacity="0.8">
    <!-- Top Left -->
    <path d="M 24 44 L 24 24 L 44 24"/>
    <!-- Top Right -->
    <path d="M 956 24 L 976 24 L 976 44"/>
    <!-- Bottom Left -->
    <path d="M 24 256 L 24 276 L 44 276"/>
    <!-- Bottom Right -->
    <path d="M 956 276 L 976 276 L 976 256"/>
  </g>

  <!-- Top Telemetry Bar -->
  <text x="54" y="38" class="hud-text">SYS.ARCH // <tspan class="hud-val">SPATIAL_WEB &amp; AGENTIC_AI</tspan></text>
  <text x="946" y="38" text-anchor="end" class="hud-text">RENDER PIPELINE // <tspan class="hud-val">60.0 FPS LOCKED</tspan></text>

  <!-- Center Hero Typography -->
  <text x="500" y="102" text-anchor="middle" class="subtitle">SPATIAL WEB ARCHITECT  •  CREATIVE FRONTEND  •  AI ENGINEER</text>
  
  <text x="500" y="160" text-anchor="middle" class="title" filter="url(#glow)">HYEGANG KWON</text>

  <!-- Glowing Divider Line -->
  <rect x="330" y="182" width="340" height="2.5" rx="1.25" fill="url(#cyanGlow)"/>
  <rect x="470" y="181" width="60" height="4.5" rx="2.25" fill="url(#goldAccent)"/>

  <!-- Highlight Pills inside Banner -->
  <g transform="translate(500, 218)">
    <!-- Pill 1 -->
    <g transform="translate(-335, 0)">
      <rect x="0" y="0" width="210" height="30" rx="15" fill="#0f172a" stroke="#22d3ee" stroke-width="1.2" stroke-opacity="0.7"/>
      <circle cx="18" cy="15" r="4" fill="#22d3ee" class="pulse-node"/>
      <text x="112" y="19" text-anchor="middle" class="badge-text">WebGL / Three.js 3D</text>
    </g>
    <!-- Pill 2 -->
    <g transform="translate(-110, 0)">
      <rect x="0" y="0" width="220" height="30" rx="15" fill="#0f172a" stroke="#fbbf24" stroke-width="1.2" stroke-opacity="0.85"/>
      <circle cx="18" cy="15" r="4" fill="#fbbf24" class="pulse-node-delay"/>
      <text x="116" y="19" text-anchor="middle" class="badge-text" fill="#fef08a">Google DeepMind '26</text>
    </g>
    <!-- Pill 3 -->
    <g transform="translate(125, 0)">
      <rect x="0" y="0" width="210" height="30" rx="15" fill="#0f172a" stroke="#818cf8" stroke-width="1.2" stroke-opacity="0.7"/>
      <circle cx="18" cy="15" r="4" fill="#818cf8" class="pulse-node"/>
      <text x="112" y="19" text-anchor="middle" class="badge-text">Resilient Frontend</text>
    </g>
  </g>

  <!-- Bottom HUD Readout -->
  <text x="54" y="272" class="hud-text">LOC // <tspan fill="#94a3b8">REPUBLIC OF KOREA</tspan></text>
  <text x="500" y="272" text-anchor="middle" class="hud-text">SIGNATURE // <tspan fill="#fbbf24">POMPOMPURIN DEV LOUNGE 🍮</tspan></text>
  <text x="946" y="272" text-anchor="end" class="hud-text">STATUS // <tspan class="hud-val">BUILDING THE FUTURE</tspan></text>

  <!-- Outer Frame Border -->
  <rect x="1" y="1" width="998" height="298" rx="15" fill="none" stroke="#1e293b" stroke-width="2"/>
</svg>
