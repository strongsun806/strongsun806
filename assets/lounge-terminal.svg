<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 185" width="100%" height="100%">
  <defs>
    <linearGradient id="termBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a12"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="termBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.7"/>
      <stop offset="50%" stop-color="#22d3ee" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.7"/>
    </linearGradient>
  </defs>

  <style>
    .mono {
      font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
      font-size: 13px;
      fill: #cbd5e1;
    }
    .mono-dim {
      font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
      font-size: 12px;
      fill: #64748b;
    }
    .mono-cyan {
      font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
      font-size: 13px;
      font-weight: 700;
      fill: #22d3ee;
    }
    .mono-gold {
      font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
      font-size: 13px;
      font-weight: 700;
      fill: #fbbf24;
    }
    .mono-indigo {
      font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
      font-size: 13px;
      font-weight: 700;
      fill: #a5b4fc;
    }
    .cursor {
      animation: blink 1.1s step-end infinite;
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
  </style>

  <!-- Terminal Window Frame -->
  <rect x="2" y="2" width="996" height="181" rx="12" fill="url(#termBg)" stroke="url(#termBorder)" stroke-width="1.5"/>
  
  <!-- Title Bar -->
  <path d="M 2 14 Q 2 2 14 2 L 986 2 Q 998 2 998 14 L 998 36 L 2 36 Z" fill="#111827"/>
  <line x1="2" y1="36" x2="998" y2="36" stroke="#1e293b" stroke-width="1"/>

  <!-- Traffic Lights -->
  <circle cx="24" cy="19" r="6" fill="#ef4444"/>
  <circle cx="44" cy="19" r="6" fill="#f59e0b"/>
  <circle cx="64" cy="19" r="6" fill="#10b981"/>
  <text x="500" y="23" text-anchor="middle" class="mono-dim">hyegang@spatial-lounge: ~/pompompurin-dev-core (zsh)</text>

  <!-- Terminal Body -->
  <g transform="translate(28, 66)">
    <text x="0" y="0" class="mono">
      <tspan class="mono-cyan">➜</tspan> <tspan class="mono-gold">~</tspan> <tspan class="mono-indigo">whoami</tspan> --philosophy
    </text>
    <text x="22" y="26" class="mono">
      "Optimizing <tspan class="mono-cyan">60FPS Spatial Frames</tspan>, Architecting <tspan class="mono-indigo">Resilient Logic</tspan>, &amp; Crafting <tspan class="mono-gold">Agentic AI Universes</tspan>."
    </text>

    <text x="0" y="60" class="mono">
      <tspan class="mono-cyan">➜</tspan> <tspan class="mono-gold">~</tspan> <tspan class="mono-indigo">cat</tspan> collaboration_status.json
    </text>
    <text x="22" y="86" class="mono">
      { <tspan class="mono-gold">"openTo"</tspan>: [<tspan class="mono-cyan">"3D Spatial Web"</tspan>, <tspan class="mono-cyan">"Frontend Architecture"</tspan>, <tspan class="mono-cyan">"AI Hackathon &amp; R&amp;D"</tspan>], <tspan class="mono-gold">"vibe"</tspan>: <tspan class="mono-indigo">"Pompompurin 🍮✨"</tspan> }
    </text>
    <rect x="860" y="73" width="8" height="16" fill="#22d3ee" class="cursor"/>
  </g>
</svg>
